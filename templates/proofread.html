<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตรวจและปรับภาษา</title>
<link rel="stylesheet" href="/static/model.css">
<script src="/static/model.js" defer></script>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1f2430; --accent:#2f6fed; --soft:#eceef4; --border:#dde0ea; --ok:#e7f6ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --card:#1d2029; --text:#e6e8ef; --accent:#3b7bff; --soft:#2a2e3a; --border:#333847; --ok:#1e3326; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
  .app { max-width:860px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:18px; margin:0; }
  small { opacity:.7; font-weight:normal; }
  a { color:var(--accent); }
  textarea { width:100%; min-height:150px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
             background:var(--card); color:var(--text); font:inherit; line-height:1.6; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .modes label { padding:6px 12px; border:1px solid var(--border); border-radius:20px; background:var(--card); cursor:pointer; }
  .modes input { display:none; }
  .modes label:has(input:checked) { background:var(--accent); color:#fff; border-color:var(--accent); }
  button { padding:10px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button.ghost { background:var(--soft); color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .card h2 { font-size:14px; margin:0 0 6px; opacity:.7; }
  #corrected { white-space:pre-wrap; line-height:1.7; background:var(--ok); }
  ul { margin:0; padding-left:20px; line-height:1.7; }
  .err { color:#c53030; }
  del { background:#fbd5d5; color:#9b1c1c; text-decoration:line-through; border-radius:3px; }
  ins { background:#bfeccb; color:#14532d; text-decoration:none; border-radius:3px; }
  @media (prefers-color-scheme: dark) {
    del { background:#5b2222; color:#fecaca; }
    ins { background:#1f5a34; color:#bbf7d0; }
  }
  #result { display:flex; flex-direction:column; gap:12px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <h1>ตรวจและปรับภาษา <small>· <a href="/">หน้าแรก</a> · <a href="/chat">แชท</a> · <a href="/write">ช่วยเขียน</a> · <a href="/ask">ถามตอบจากเอกสาร</a> · <a href="/meeting">สรุปประชุม</a> · <a href="/bidding">ตรวจเอกสารเสนอราคา</a></small></h1>
  <label class="modelbar">โมเดล <select id="model"></select></label>

  <textarea id="text" maxlength="5000" placeholder="วางข้อความที่ต้องการตรวจ เช่น: ผมขอเรียนแจ้งว่า เอกสารที่ส่งมานั้นไม่ครบ ช่วยส่งมาใหม่ด้วยนะคับ"></textarea>

  <div class="row modes" id="modes">
    <label><input type="radio" name="mode" value="typo" checked>แก้คำผิด</label>
    <label><input type="radio" name="mode" value="polite">สุภาพขึ้น</label>
    <label><input type="radio" name="mode" value="concise">กระชับขึ้น</label>
    <label><input type="radio" name="mode" value="formal">ทางการ</label>
  </div>

  <div class="row">
    <button id="go">ตรวจข้อความ</button>
    <button id="example" class="ghost">ใส่ตัวอย่าง</button>
    <button id="upload" class="ghost">อัปโหลด .docx</button>
    <input type="file" id="file" accept=".docx" class="hidden">
  </div>

  <div id="status" class="err"></div>

  <div id="result" class="hidden">
    <div class="card">
      <h2>ข้อความที่แก้แล้ว</h2>
      <div id="corrected"></div>
      <div class="row" style="margin-top:8px">
        <button id="copy" class="ghost">คัดลอก</button>
        <button id="toggle" class="ghost">ดูข้อความล้วน</button>
      </div>
    </div>
    <div class="card">
      <h2>สิ่งที่แก้</h2>
      <ul id="changes"></ul>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const EXAMPLE = "เรียน ท่านผู้อำนวยการ ผมขอเรียนแจ้งว่า เอกสารที่ส่งมานั้น มันไม่ครบถ้วนตามที่ได้แจ้งไว้ ซึ่งทางเรามีความจำเป็นที่จะต้องขอให้ท่านช่วยจัดส่งเอกสารมาให้ใหม่อีกครั้งนึงด้วยนะคับ เพราะว่าถ้าไม่มีเอกสารเหล่านี้ เราก็ไม่สามารถที่จะดำเนินการต่อไปได้ครับ";

  $("example").onclick = () => { $("text").value = EXAMPLE; };

  let plain = "", diffHtml = "", showDiff = true;

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const tokenize = (s) => Array.from(new Intl.Segmenter("th", { granularity: "word" }).segment(s), (x) => x.segment);

  // เทียบระดับคำด้วย LCS แล้วคืน HTML ที่ครอบส่วนลบด้วย <del> และส่วนเพิ่มด้วย <ins>
  function diff(a, b) {
    const x = tokenize(a), y = tokenize(b);
    const n = x.length, m = y.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--)
      for (let j = m - 1; j >= 0; j--)
        dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = [];
    const push = (kind, t) => {
      const last = out[out.length - 1];
      if (last && last.kind === kind) last.text += t; else out.push({ kind, text: t });
    };
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (x[i] === y[j]) { push("same", x[i]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { push("del", x[i++]); }
      else { push("ins", y[j++]); }
    }
    while (i < n) push("del", x[i++]);
    while (j < m) push("ins", y[j++]);
    return out.map((p) => p.kind === "same" ? esc(p.text) : `<${p.kind}>${esc(p.text)}</${p.kind}>`).join("");
  }

  function render() {
    if (showDiff) $("corrected").innerHTML = diffHtml; else $("corrected").textContent = plain;
    $("toggle").textContent = showDiff ? "ดูข้อความล้วน" : "ดูส่วนที่แก้";
  }

  $("toggle").onclick = () => { showDiff = !showDiff; render(); };

  $("upload").onclick = () => $("file").click();
  $("file").onchange = async () => {
    const f = $("file").files[0];
    if (!f) return;
    $("status").textContent = "";
    const fd = new FormData();
    fd.append("file", f);
    try {
      const res = await fetch("/api/extract", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      $("text").value = data.text.slice(0, 5000);
      if (data.text.length > 5000) $("status").textContent = "ไฟล์ยาวกว่า 5,000 ตัวอักษร ตัดเหลือส่วนแรกเท่านั้น";
    } catch (err) {
      $("status").textContent = err.message;
    }
    $("file").value = "";
  };

  $("copy").onclick = async () => {
    await navigator.clipboard.writeText(plain);
    $("copy").textContent = "คัดลอกแล้ว";
    setTimeout(() => ($("copy").textContent = "คัดลอก"), 1500);
  };

  $("go").onclick = async () => {
    const text = $("text").value.trim();
    if (!text) { $("status").textContent = "กรุณาใส่ข้อความก่อน"; return; }
    const mode = document.querySelector('input[name="mode"]:checked').value;
    $("status").textContent = "";
    $("go").disabled = true;
    $("go").textContent = "กำลังตรวจ...";
    try {
      const res = await fetch("/api/proofread", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, mode, model: getModel() }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      plain = data.corrected;
      diffHtml = diff(text, plain);
      showDiff = true;
      render();
      const ul = $("changes");
      ul.innerHTML = "";
      if (!data.changes.length) {
        ul.innerHTML = "<li>ไม่พบสิ่งที่ต้องแก้</li>";
      } else {
        data.changes.forEach((c) => {
          const li = document.createElement("li");
          li.textContent = c;
          ul.appendChild(li);
        });
      }
      $("result").classList.remove("hidden");
    } catch (err) {
      $("status").textContent = err.message;
    } finally {
      $("go").disabled = false;
      $("go").textContent = "ตรวจข้อความ";
    }
  };
</script>
</body>
</html>
